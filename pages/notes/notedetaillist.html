<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <title>List Detail</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0"
    />

    <link rel="stylesheet" href="notedetailist.css" />
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->

      <div class="header">
        <button class="icon-btn" onclick="history.back()">
          <span class="material-symbols-rounded"> arrow_back </span>
        </button>

        <span class="header-title"> List Detail </span>
      </div>

      <!-- CONTENT -->

      <div class="content">
        <div class="card">
          <!-- TITLE -->

          <input
            type="text"
            id="listTitle"
            class="list-title"
            placeholder="Nama List..."
          />

          <p class="list-subtitle">Checklist Workspace</p>

          <!-- PROGRESS -->

          <div class="progress-section">
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>

            <p id="progressText" class="progress-text">
              0 of 0 tasks completed
            </p>
          </div>

          <!-- TASKS -->

          <div id="taskList" class="task-list">
            <!-- JS RENDER -->

            <div class="task-item">
              <input type="checkbox" class="task-checkbox" />

              <input
                type="text"
                class="task-input"
                placeholder="Tambah task..."
              />
            </div>
          </div>

          <!-- ADD TASK -->

          <button id="addTaskBtn" class="add-task-btn">+ Tambah Task</button>

          <!-- NOTES -->

          <div class="section">
            <h3 class="section-title">Notes</h3>

            <textarea
              id="listNotes"
              class="list-notes"
              placeholder="Tambahkan catatan..."
            ></textarea>
          </div>

          <!-- INFO -->

          <div class="section">
            <div class="info-row">
              <span> Last Updated </span>

              <strong id="updatedAt"> - </strong>
            </div>
          </div>
        </div>
      </div>

      <!-- FLOATING ACTIONS -->

      <div class="floating-actions">
        <button id="saveBtn" class="action-btn save-btn">
          <span class="material-symbols-rounded"> save </span>
        </button>

        <button id="deleteBtn" class="action-btn delete-btn">
          <span class="material-symbols-rounded"> delete </span>
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="notedetailist.js"></script>
  </body>
</html>
