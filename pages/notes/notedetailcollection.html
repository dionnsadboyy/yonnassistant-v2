<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <title>Collection Detail</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0"
    />

    <link rel="stylesheet" href="notedetailcollection.css" />
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->

      <div class="header">
        <button class="icon-btn" onclick="history.back()">
          <span class="material-symbols-rounded"> arrow_back </span>
        </button>

        <span class="header-title"> Collection Detail </span>
      </div>

      <!-- HERO -->

      <div class="hero">
        <input
          type="text"
          id="collectionTitle"
          class="collection-title"
          placeholder="Nama Collection..."
        />

        <p class="collection-subtitle">Personal Collection</p>

        <div class="collection-counter">
          <span id="totalItems">0</span>
          Items
        </div>
      </div>

      <!-- TAG GRID -->

      <div id="collectionGrid" class="grid">
        <!-- JS RENDER -->
      </div>

      <!-- ADD ITEM -->

      <div class="add-section">
        <button id="addItemBtn" class="add-item-btn">
          <span class="material-symbols-rounded"> add </span>

          Tambah Item
        </button>
      </div>

      <!-- NOTES -->

      <div class="section">
        <div class="card">
          <h3>Collection Notes</h3>

          <textarea
            id="collectionNotes"
            class="collection-notes"
            placeholder="Tambahkan catatan..."
          ></textarea>
        </div>
      </div>

      <!-- INFO -->

      <div class="section">
        <div class="card">
          <div class="info-row">
            <span> Last Updated </span>

            <strong id="updatedAt"> - </strong>
          </div>
        </div>
      </div>

      <!-- FLOATING ACTIONS -->

      <div class="floating-actions">
        <button id="saveBtn" class="action-btn save-btn">
          <span class="material-symbols-rounded"> save </span>
        </button>

        <button id="deleteBtn" class="action-btn delete-btn">
          <span class="material-symbols-rounded"> delete </span>
        </button>
      </div>
    </div>

    <!-- TEMPLATE ITEM -->

    <template id="itemTemplate">
      <div class="tag">
        <input
          type="text"
          class="collection-item-input"
          placeholder="Nama Item..."
        />

        <button class="remove-item-btn">×</button>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="notedetailcollection.js"></script>
  </body>
</html>
