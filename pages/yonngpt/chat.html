<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>YonnGPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../script/supabase.js"></script>

    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="chat-page">
      <!-- HEADER -->

      <header class="chat-header">
        <button class="back-btn">←</button>

        <div class="header-info">
          <img src="../../assets/iconpack/hello.png" class="header-avatar" />

          <div>
            <h3>YonnGPT</h3>
            <span id="statusText">Siap ngobrol</span>
          </div>
        </div>

        <div class="header-actions">
          <button id="menuBtn" class="menu-btn">
            <span class="material-symbols-rounded"> menu </span>
          </button>

          <div id="menuPopup" class="menu-popup">
            <a href="#" id="newChatBtn"> 🆕 Chat Baru </a>
          </div>
        </div>
      </header>

      <!-- CHAT AREA -->
      <div id="chatMessages" class="chat-messages">
        <!-- EMPTY STATE -->

        <div id="emptyState" class="empty-state">
          <img src="../../assets/iconpack/hello.png" class="empty-avatar" />

          <h2>Halo Dion 👋</h2>

          <p>Ada yang mau dibahas hari ini?</p>

          <div class="quick-ask">
            <button class="quick-btn">💸 Kemana uang gue?</button>

            <button class="quick-btn">📉 Boros bulan ini?</button>

            <button class="quick-btn">🎯 Budget minggu depan</button>

            <button class="quick-btn">🚬 Pengeluaran rokok</button>
          </div>
        </div>

        <!-- CHAT HISTORY RENDER DI SINI -->
      </div>

      <!-- INPUT AREA -->
      <div class="chat-input">
        <input type="file" id="imageInput" accept="image/*" hidden />

        <button id="imageBtn">
          <span class="material-symbols-rounded"> image </span>
        </button>

        <div class="input-wrapper">
          <div id="imagePreview" class="image-preview" style="display: none">
            <img id="previewImage" />

            <button id="removeImageBtn" type="button">✕</button>
          </div>

          <textarea
            id="messageInput"
            placeholder="Tanyakan apa saja"
            rows="1"
          ></textarea>

          <div id="recordingUI" class="recording-ui">
            <div class="record-dot"></div>

            <span>Mendengarkan...</span>

            <div class="wave">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <button id="micBtn">🎤</button>

        <button id="sendBtn">➤</button>
      </div>
    </div>
    <!-- <script src="analytic.js"></script> -->
    <script src="chat.js"></script>
  </body>
</html>
