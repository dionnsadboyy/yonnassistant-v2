<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>YonnGPT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../script/supabase.js"></script>

    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="chat-page">
      <header class="chat-header">
        <button class="back-btn" onclick="history.back()">←</button>

        <div class="header-info">
          <img src="../../assets/iconpack/hello.png" class="header-avatar" />

          <div>
            <h3>YonnGPT</h3>
            <span>Online</span>
          </div>
        </div>
      </header>

      <div id="chatMessages" class="chat-messages">
        <div class="bot-message">
          <img src="../../assets/iconpack/hello.png" class="message-avatar" />

          <div class="message-bubble">
            Halo Dion 👋

            <br /><br />

            Ada yang mau dibahas hari ini?
          </div>
        </div>
      </div>

      <div class="quick-ask">
        <button class="quick-btn">💸 Kemana uang gue?</button>

        <button class="quick-btn">📉 Boros bulan ini?</button>

        <button class="quick-btn">🎯 Budget minggu depan</button>

        <button class="quick-btn">🚬 Pengeluaran rokok</button>
      </div>

      <div class="chat-input">
        <input id="messageInput" type="text" placeholder="Tanya Yonn..." />

        <button id="sendBtn">➤</button>
      </div>
    </div>

    <script src="analythic.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
